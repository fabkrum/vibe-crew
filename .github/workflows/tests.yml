name: Tests

on:
  push:
    branches: [main]
    paths:
      - 'claude-plugin-vibe-crew/**'
  pull_request:
    branches: [main]
    paths:
      - 'claude-plugin-vibe-crew/**'

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
      fail-fast: false

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install jq
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Verify jq available
        run: jq --version

      - name: Run tests
        working-directory: claude-plugin-vibe-crew
        run: tests/run-tests.sh
